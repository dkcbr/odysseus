services:
  odysseus:
    build: .
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-7000}:7000"
    # Real, added 2026-08-18: direct passthrough of the real host's
    # /dev/uinput device, for jarvis_desktop's scroll() tool -- a real,
    # separate python-evdev script that creates its own virtual input
    # device to inject wheel events (ydotool 0.1.8 has no scroll
    # support at all, confirmed directly; the newer ydotool that does
    # has a real, unresolved absolute-positioning bug, not a safe
    # trade -- see scroll()'s own docstring in jarvis_desktop_mcp.py
    # for the full history).
    devices:
      - /dev/uinput:/dev/uinput
    volumes:
      - ${APP_DATA_DIR:-./data}:/app/data:z
      - ${APP_LOGS_DIR:-./logs}:/app/logs:z
      # Real, added 2026-08-17: mount the real Risk Engine's real output
      # directory read-only, so the risk_surface MCP server (which reads
      # regime.json/risk_events.json/factors.json/suggestions.json) can
      # actually see the real, host-side pipeline output. The Risk Engine
      # itself (~/jarvis/risk_engine/) runs on the host via cron, not
      # inside this container -- this mount is read-only since the
      # container should never write into the pipeline's own output dir.
      - /home/dk/jarvis/risk_engine:/app/risk_engine_data:ro
      # Real, added 2026-08-17: mount the real, running XWayland X11 socket
      # (confirmed live via `ps aux | grep Xwayland` -- "Xwayland :1") so
      # jarvis_desktop's real wmctrl/xdotool window/mouse/keyboard tools can
      # actually reach the real host display, not just report a missing
      # socket. rw (not ro) since X11 clients need to write to the socket.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Real, added 2026-08-19: mount the real Obsidian vault read-only.
      # Confirmed directly (GitHub issue #14, and two live tests tonight)
      # that no vault-search tool has ever worked, because the container
      # had no filesystem access to this real, host-side directory at
      # all -- every "I don't have this in my vault" answer tonight was
      # honestly correct given the real, actual toolset, not a model
      # failure. Read-only: this tool should never write into DK's own,
      # hand-maintained vault.
      - /home/dk/gdrive/Obsidian:/app/vault_data:ro
      # Real, added 2026-08-17: mount the real ydotool socket. xdotool's
      # mouse/keyboard control was confirmed NOT visually working (real,
      # repeated testing) -- XWayland rootless mode appears to isolate
      # X11-level input injection from COSMIC's native Wayland input.
      # ydotool injects real events at the kernel level (via /dev/uinput
      # on the host, through the real ydotoold daemon DK started), which
      # should bypass XWayland's isolation entirely.
      - /tmp/.ydotool_socket:/tmp/.ydotool_socket:rw
      # Cookbook remote-server SSH identity. Odysseus can generate a key here;
      # add the shown public key to each remote server's authorized_keys.
      - ${APP_DATA_DIR:-./data}/ssh:/app/.ssh:z
      # Cookbook local model cache. Inside Docker, "Local" means the Odysseus
      # container, so persist its HuggingFace cache under ./data/huggingface.
      - ${APP_DATA_DIR:-./data}/huggingface:/app/.cache/huggingface:z
      # Cookbook-installed Python CLIs/packages (vLLM, llama-cpp-python, etc.)
      # land under /app/.local for the odysseus user. Persist them so a
      # container recreate does not silently remove installed serve engines.
      - ${APP_DATA_DIR:-./data}/local:/app/.local:z
      # Real, read-only mount for the OHLCV/PCA pipeline output, needed by
      # routes/factor_routes.py (restored 2026-08-09 alongside the rest of
      # the Aug 5 diagnostics feature set). Read-only since this route only
      # reads pre-computed factor files; the PCA build itself stays a
      # separate, on-demand host-side step, not run inside the container.
      - /home/dk/jarvis-scripts:/home/dk/jarvis-scripts:ro
      # Real, read-only mount for Infinite Brain OS, a real, separate
      # knowledge-architecture repo -- indexed into the existing RAG
      # system (search_rag tool, mcp_servers/rag_server.py) so Jarvis
      # can search and cite it without importing or restructuring the
      # actual Jarvis vault. Read-only, matching the same reasoning as
      # the jarvis-scripts mount above.
      - /home/dk/jarvis/infinite-brain-os:/home/dk/jarvis/infinite-brain-os:ro
      # Local stdio MCP server directories -- restored 2026-08-08, missing
      # since the dev-based deploy, which is why jarvis_desktop, jarvis_system,
      # wigolo, and risk_surface (all stdio-transport MCP servers) showed
      # "disconnected" in the UI: they couldn't reach these host paths from
      # inside the container. X11 passthrough (needed for jarvis_desktop's
      # wmctrl/xdotool/imagemagick tools specifically) deliberately NOT
      # restored yet - real security-relevant change, holding off until
      # explicitly requested.
      - ./mcp_servers:/app/mcp_servers
      - /home/dk/tradingview-mcp:/app/tradingview_real:ro
      - type: bind
        source: /home/dk/jarvis/projects/odysseus-vault-sync
        target: /home/dk/jarvis/projects/odysseus-vault-sync
    extra_hosts:
      # Lets the container reach local services on the Docker host, including
      # Ollama at http://host.docker.internal:11434.
      - "host.docker.internal:host-gateway"
    environment:
      # Real, added 2026-08-17: points jarvis_desktop's wmctrl/xdotool at the
      # real, running XWayland instance (confirmed live: "Xwayland :1"),
      # via the X11 socket mounted above.
      - DISPLAY=:1
      # Real, added 2026-08-17: tells ydotool client where the real,
      # mounted socket is (see the volume mount above).
      - YDOTOOL_SOCKET=/tmp/.ydotool_socket
      - LLM_HOST=${LLM_HOST:-localhost}
      - LLM_HOSTS=${LLM_HOSTS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - FMP_API_KEY=${FMP_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - RESEARCH_LLM_ENDPOINT=${RESEARCH_LLM_ENDPOINT:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - SEARXNG_INSTANCE=http://searxng:8080
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - LOCALHOST_BYPASS=${LOCALHOST_BYPASS:-false}
      - ODYSSEUS_ADMIN_USER=${ODYSSEUS_ADMIN_USER:-admin}
      - ODYSSEUS_ADMIN_PASSWORD=${ODYSSEUS_ADMIN_PASSWORD:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - EMBEDDING_URL=${EMBEDDING_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - FASTEMBED_MODEL=${FASTEMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - FASTEMBED_CACHE_PATH=${FASTEMBED_CACHE_PATH:-}
      - CLEANUP_INTERVAL_HOURS=${CLEANUP_INTERVAL_HOURS:-24}
      - ODYSSEUS_INPROCESS_POLLERS=${ODYSSEUS_INPROCESS_POLLERS:-1}
      - ODYSSEUS_INPROCESS_TASKS=${ODYSSEUS_INPROCESS_TASKS:-1}
      - ODYSSEUS_SCRIPT_HOST=${ODYSSEUS_SCRIPT_HOST:-localhost}
      - ODYSSEUS_CHAT_UPLOAD_MAX_BYTES=${ODYSSEUS_CHAT_UPLOAD_MAX_BYTES:-10485760}
      - ODYSSEUS_GALLERY_UPLOAD_MAX_BYTES=${ODYSSEUS_GALLERY_UPLOAD_MAX_BYTES:-104857600}
      - ODYSSEUS_GALLERY_TRANSFORM_UPLOAD_MAX_BYTES=${ODYSSEUS_GALLERY_TRANSFORM_UPLOAD_MAX_BYTES:-26214400}
      - ODYSSEUS_MEMORY_IMPORT_MAX_BYTES=${ODYSSEUS_MEMORY_IMPORT_MAX_BYTES:-10485760}
      # Real, added 2026-08-09: manage_memory's real, existing owner-scoped
      # entries (confirmed via data/memory.json: owner=admin) need this set,
      # or every owner-scoped list/search call errors. See .env.
      - ODYSSEUS_MCP_MEMORY_OWNER=${ODYSSEUS_MCP_MEMORY_OWNER:-}
      - ODYSSEUS_PERSONAL_UPLOAD_MAX_BYTES=${ODYSSEUS_PERSONAL_UPLOAD_MAX_BYTES:-26214400}
      - ODYSSEUS_EMAIL_COMPOSE_UPLOAD_MAX_BYTES=${ODYSSEUS_EMAIL_COMPOSE_UPLOAD_MAX_BYTES:-26214400}
      - ODYSSEUS_STT_MAX_AUDIO_BYTES=${ODYSSEUS_STT_MAX_AUDIO_BYTES:-26214400}
      - ODYSSEUS_ICS_MAX_BYTES=${ODYSSEUS_ICS_MAX_BYTES:-10485760}
      - ODYSSEUS_TTS_CACHE_MAX_BYTES=${ODYSSEUS_TTS_CACHE_MAX_BYTES}
      - DATA_BRAVE_API_KEY=${DATA_BRAVE_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_PSE_CX=${GOOGLE_PSE_CX:-}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      # PUID / PGID — the user/group the container drops to before
      # running uvicorn (entrypoint also chowns /app/data + /app/logs
      # to match, so bind-mounted files stay editable from the host).
      # 1000 is the default first user on most Linux installs. If your
      # host user has a different id, override here or via .env, e.g.:
      #   PUID=1001
      #   PGID=1001
      # Find yours with:  id -u  /  id -g
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    depends_on:
      searxng:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped

  chromadb:
    image: docker.io/chromadb/chroma:latest
    ports:
      - "${CHROMADB_BIND:-127.0.0.1}:8100:8000"
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  searxng:
    # Pinned, not :latest — odysseus waits on searxng's healthcheck
    # (depends_on: condition: service_healthy), so a broken upstream `latest`
    # tag blocks the whole app from starting. 2026.6.2 crashes on boot with
    # `KeyError: 'default_doi_resolver'`, failing the healthcheck (issue #1414).
    # Bump this deliberately after verifying a newer tag boots clean.
    image: docker.io/searxng/searxng:2026.5.31-7159b8aed
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -s /etc/searxng/settings.yml ] || grep -q 'odysseus-local-searxng-json-2026-05-30\|__SEARXNG_SECRET__' /etc/searxng/settings.yml; then
          secret="$${SEARXNG_SECRET:-}"
          if [ -z "$$secret" ]; then
            secret="$$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          fi
          sed "s|__SEARXNG_SECRET__|$$secret|g" /tmp/searxng-settings.yml.template > /etc/searxng/settings.yml
        fi
        exec /usr/local/searxng/entrypoint.sh
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - searxng-data:/etc/searxng
      - ./config/searxng/settings.yml:/tmp/searxng-settings.yml.template:ro,z
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    # The official searxng image runs as the non-root `searxng` user, but its
    # entrypoint still needs to chown /etc/searxng on first boot, drop privs via
    # su-exec, and (with our wrapper above) write settings.yml into the named
    # volume. Without these capabilities the wrapper aborts at the redirection
    # with EACCES and the container fails its healthcheck with permission
    # errors during setup. Mirrors the cap set recommended by the upstream
    # searxng-docker compose file. See issue #721.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)\""]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ntfy:
    image: docker.io/binwiederhier/ntfy
    command: serve
    ports:
      - "${NTFY_BIND:-127.0.0.1}:8091:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8091}
    restart: unless-stopped

volumes:
  searxng-data:
  chromadb-data:
  ntfy-cache:
